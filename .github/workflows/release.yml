name: release

# Publishes to npm when a version tag is pushed.
#
# Authentication is trusted publishing, and nothing else. GitHub mints a
# short-lived OIDC credential that npm verifies against a publisher configured
# on the package. There is no npm token in this repository and none on
# anybody's laptop, which is the point: a stored publish credential is the
# thing worth not having. CrossRev publishes the same way.
#
# Configure the publisher once, against this file:
#
#   npm trust github copydesk --file release.yml \
#     --repo carlosboeing/copydesk --allow-publish
#
# 0.1.0 was published by hand. Its CI publish failed with ENEEDAUTH, because
# npm needs a package to exist before a publisher can be added to it
# (npm/cli#8544), and no publisher existed yet. 0.2.0 then failed the same
# way: the publisher was still absent, and an unset NPM_TOKEN made setup-node
# write an .npmrc declaring an empty _authToken, which reads as auth that is
# configured and wrong rather than auth that is missing.
#
# No `environment:` on the publish job. npm matches the environment as an OIDC
# claim, so a block here must be mirrored by --env there or the exchange fails.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify the release is coherent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The suite must pass on the exact commit being released
        run: python3 -m unittest discover tests/

      - name: The instructions must match the preset
        run: python3 scripts/generate-instructions.py --check

      - name: VERSION, package.json and the tag must agree
        id: version
        run: |
          set -euo pipefail
          file_version="$(cat VERSION)"
          json_version="$(node -p "require('./package.json').version")"
          cli_version="$(python3 bin/copydesk --version)"

          echo "VERSION      $file_version"
          echo "package.json $json_version"
          echo "--version    $cli_version"

          if [ "$file_version" != "$json_version" ] || [ "$file_version" != "$cli_version" ]; then
            echo "::error::VERSION, package.json and bin/copydesk --version disagree"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            echo "tag          $tag_version"
            if [ "$tag_version" != "$file_version" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match version $file_version"
              exit 1
            fi
          fi

          echo "version=$file_version" >> "$GITHUB_OUTPUT"

      - name: The tarball must carry the shipped surface and nothing else
        run: |
          set -euo pipefail
          npm pack --dry-run --json > pack.json
          node -e '
            const [pack] = require("./pack.json");
            const files = pack.files.map(f => f.path).sort();
            console.log(files.join("\n"));

            const required = [
              "LICENSE", "README.md", "VERSION", "package.json",
              "bin/copydesk", "lib/linter.py", "lib/config.py",
              "rules/plain-english.json", "hooks/gate.sh", "hooks/reminder.sh",
            ];
            const missing = required.filter(f => !files.includes(f));
            if (missing.length) {
              console.error("::error::missing from the tarball: " + missing.join(", "));
              process.exit(1);
            }

            // An allowlist, not a blocklist. Every packed path must fall under
            // package.json `files`, or be one npm always includes. A blocklist
            // only catches the leaks somebody thought of; this catches any path
            // that appears because `files` was widened. The `!` entries are
            // package.json's own exclusions and are checked after.
            const spec = require("./package.json").files;
            const allowed = spec.filter(a => !a.startsWith("!"));
            const always = ["LICENSE", "README.md", "package.json"];
            const stray = files.filter(f =>
              !always.includes(f) &&
              !allowed.some(a => a.endsWith("/") ? f.startsWith(a) : f === a));
            if (stray.length) {
              console.error("::error::not covered by package.json files: " + stray.join(", "));
              process.exit(1);
            }

            const compiled = files.filter(f =>
              f.includes("__pycache__") || f.endsWith(".pyc") || f.endsWith(".pyo"));
            if (compiled.length) {
              console.error("::error::compiled Python must not publish: " + compiled.join(", "));
              process.exit(1);
            }

            const kb = pack.size / 1024;
            console.log(`tarball ${kb.toFixed(1)} kB across ${files.length} files`);
            if (kb > 200) {
              console.error("::error::tarball exceeds the 200 kB budget");
              process.exit(1);
            }
          '

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' || inputs.dry_run == false
    permissions:
      contents: write   # to create the GitHub Release
      id-token: write   # to mint the OIDC credential for trusted publishing
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false   # never cache in a release build

      - name: Trusted publishing needs npm 11.5.1 or later
        run: |
          npm install -g npm@latest
          npm --version

      - name: Publish
        # No NODE_AUTH_TOKEN. With the secret absent it resolves to an empty
        # string, and setup-node still writes an .npmrc declaring _authToken=,
        # which reads as auth that is configured and wrong rather than absent.
        # OIDC is the only credential, which is the point of trusted publishing.
        run: npm publish --access public --provenance

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          # Lift this version's section out of the changelog for the release body.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > body.md
          if [ ! -s body.md ]; then
            echo "See CHANGELOG.md." > body.md
          fi
          gh release create "v$version" --title "v$version" --notes-file body.md --verify-tag

  smoke:
    name: Install from the registry and run it
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      # A publish nobody installed is a publish nobody verified. This runs the
      # published artifact from a clean directory, on the oldest supported
      # interpreter, rather than trusting the local checkout.
      - name: npx the published version
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          for attempt in 1 2 3 4 5; do
            if npx --yes "copydesk@$version" --version; then break; fi
            echo "not on the registry yet, retrying in 15s"
            sleep 15
          done
          test "$(npx --yes copydesk@$version --version)" = "$version"
          printf 'A short sentence has enough words for this check.\n' \
            | npx --yes "copydesk@$version" check -
          set +e
          printf 'This approach is robust and comprehensive.\n' \
            | npx --yes "copydesk@$version" check -
          status=$?
          set -e
          test "$status" -eq 1
          echo "published artifact verified"
