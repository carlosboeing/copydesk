name: Feature request
description: Suggest a focused change to CopyDesk.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Explain the problem first. Keep the proposal focused on one change.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you want and how it would work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What other approaches or workarounds did you consider?
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Note compatibility, documentation, or release concerns.
